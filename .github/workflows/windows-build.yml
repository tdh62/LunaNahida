name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_converter:
        description: 'Require unlock-music variants (requires MUSIC_RESTORE_TOKEN)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out player
        uses: actions/checkout@v4

      - name: Select unlock-music variants
        id: variants
        env:
          MUSIC_RESTORE_TOKEN: ${{ secrets.MUSIC_RESTORE_TOKEN }}
          REQUEST_CONVERTER: ${{ inputs.include_converter }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $includeConverter = $env:EVENT_NAME -ne 'pull_request' -and -not [string]::IsNullOrWhiteSpace($env:MUSIC_RESTORE_TOKEN)
          if ($env:REQUEST_CONVERTER -eq 'true' -and -not $includeConverter) {
            throw 'Set MUSIC_RESTORE_TOKEN with read access to tdh62/lunanahida_unlock_music to build unlock-music variants.'
          }
          "include_converter=$($includeConverter.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($includeConverter) {
            $moduleEntry = git ls-tree HEAD -- extensions/music-restore
            if ($LASTEXITCODE -ne 0 -or $moduleEntry -notmatch '^160000 commit ([0-9a-f]{40})\s') {
              throw 'Cannot read the pinned unlock-music submodule commit.'
            }
            "converter_commit=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output '::warning::Building desktop and portable only. Unlock-music variants require MUSIC_RESTORE_TOKEN and a push or workflow_dispatch event.'
          }

      - name: Check out pinned unlock-music source
        if: steps.variants.outputs.include_converter == 'true'
        uses: actions/checkout@v4
        with:
          repository: tdh62/lunanahida_unlock_music
          ref: ${{ steps.variants.outputs.converter_commit }}
          token: ${{ secrets.MUSIC_RESTORE_TOKEN }}
          path: extensions/music-restore
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            extensions/music-restore/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version fields
        run: pnpm check:version

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: pnpm lint

      - name: Test frontend
        run: pnpm test:frontend

      - name: Build frontend assets for Go tests
        run: pnpm build

      - name: Test player
        run: go test ./...

      - name: Test unlock-music
        if: steps.variants.outputs.include_converter == 'true'
        working-directory: extensions/music-restore
        run: go test ./...

      - name: Install matching Wails CLI
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the Wails version from go.mod.' }
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wailsVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install the Wails CLI.' }
          $goPath = go env GOPATH
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve GOPATH.' }
          Join-Path $goPath 'bin' >> $env:GITHUB_PATH

      - name: Verify unlock-music integration
        if: steps.variants.outputs.include_converter == 'true'
        run: pnpm test:converter:integration

      - name: Prepare portable WebView2 runtime
        run: ./scripts/prepare-webview2.ps1

      - name: Build and verify Windows artifacts
        env:
          INCLUDE_CONVERTER: ${{ steps.variants.outputs.include_converter }}
        run: |
          $arguments = @('scripts/build-ci-windows.mjs')
          if ($env:INCLUDE_CONVERTER -eq 'true') { $arguments += '--with-converter' }
          node @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact build or verification failed.' }

      - name: Upload desktop
        uses: actions/upload-artifact@v4
        with:
          name: LunaNahida-windows-x64-${{ github.sha }}
          path: bin/ci-windows/desktop/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: LunaNahida-windows-x64-portable-${{ github.sha }}
          path: bin/ci-windows/portable/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload desktop with unlock-music
        if: steps.variants.outputs.include_converter == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LunaNahida-windows-x64-unlock-music-${{ github.sha }}
          path: bin/ci-windows/desktop-unlock-music/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload portable with unlock-music
        if: steps.variants.outputs.include_converter == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LunaNahida-windows-x64-portable-unlock-music-${{ github.sha }}
          path: bin/ci-windows/portable-unlock-music/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
